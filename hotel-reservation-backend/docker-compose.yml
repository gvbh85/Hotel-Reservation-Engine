
services:

  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: hoteldb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: hotel-redis

    ports:
      - "6379:6379"

  hotel-backend:
    build: .

    container_name: hotel-backend

    depends_on:
      - mysql
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hoteldb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

volumes:
  mysql_data: